<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exam Prep Bank — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">§</span>
      <h1>Exam Prep Bank</h1>
      <p class="brand-sub">Your private question repository</p>
    </div>

    <p id="auth-error" class="error-banner hidden"></p>

    <button id="google-signin-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4 16 4 9.1 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5C29.6 34.7 27 35.5 24 35.5c-5.2 0-9.6-3.1-11.3-7.6l-6.6 5.1C9 39.6 15.9 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.5C41.5 35.7 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Sign in with Google
    </button>

    <div class="or-divider"><span>or</span></div>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="email" />

      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" />

      <button type="submit" class="btn-primary">Sign in</button>
      <p class="switch-line">New here? <a href="#" id="show-signup">Create an account</a></p>
    </form>

    <form id="signup-form" class="hidden">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required autocomplete="email" />

      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" required autocomplete="new-password" />

      <label for="signup-confirm">Confirm password</label>
      <input type="password" id="signup-confirm" required autocomplete="new-password" />

      <button type="submit" class="btn-primary">Create account</button>
      <p class="switch-line">Already have an account? <a href="#" id="show-login">Sign in</a></p>
    </form>
  </div>

  <!-- Firebase SDKs (compat / namespaced version — simplest for plain script tags) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
