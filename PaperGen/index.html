<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exam Prep Bank — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">§</span>
      <h1>Exam Prep Bank</h1>
      <p class="brand-sub">Your private question repository</p>
    </div>

    <p id="auth-error" class="error-banner hidden"></p>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="email" />

      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" />

      <button type="submit" class="btn-primary">Sign in</button>
      <p class="switch-line">New here? <a href="#" id="show-signup">Create an account</a></p>
    </form>

    <form id="signup-form" class="hidden">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required autocomplete="email" />

      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" required autocomplete="new-password" />

      <label for="signup-confirm">Confirm password</label>
      <input type="password" id="signup-confirm" required autocomplete="new-password" />

      <button type="submit" class="btn-primary">Create account</button>
      <p class="switch-line">Already have an account? <a href="#" id="show-login">Sign in</a></p>
    </form>
  </div>

  <!-- Firebase SDKs (compat / namespaced version — simplest for plain script tags) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
